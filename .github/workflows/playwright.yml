name: Playwright Tests

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_URL: https://tst.lebane.app
      LEBANE_USER: ${{ secrets.LEBANE_USER }}
      LEBANE_PASSWORD: ${{ secrets.LEBANE_PASSWORD }}
    steps:
      - name: Verificar credenciales (secrets)
        id: creds
        run: |
          if [ -z "$LEBANE_USER" ] || [ -z "$LEBANE_PASSWORD" ]; then
            echo "::warning::Faltan los secrets LEBANE_USER / LEBANE_PASSWORD (Settings > Secrets and variables > Actions). Se omite la ejecución de los tests."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Instalar Chromium
        if: steps.creds.outputs.ok == 'true'
        run: npx playwright install --with-deps chromium

      - name: Ejecutar tests
        if: steps.creds.outputs.ok == 'true'
        run: npx playwright test

      - name: Publicar reporte HTML
        uses: actions/upload-artifact@v6
        if: always() && steps.creds.outputs.ok == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Publicar resultados (screenshots, videos, traces)
        uses: actions/upload-artifact@v6
        if: failure() && steps.creds.outputs.ok == 'true'
        with:
          name: test-results
          path: test-results/
          retention-days: 14
